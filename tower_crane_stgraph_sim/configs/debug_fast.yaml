project:
  name: tower_crane_stgraph_sim
  version: 0.1.0
  random_seed: 20260529
  output_dir: outputs/debug_fast

simulation:
  num_scenarios: 2
  scenario_duration_s: 30.0
  dt: 0.5
  num_cranes_range: [3, 4]
  save_format: csv

layout:
  site_size_m: [120.0, 100.0]
  ensure_overlap: true
  min_base_distance_m: 18.0
  overlap_scene_ratio:
    no_overlap_safe: 0.10
    overlap_no_conflict: 0.20
    two_crane_crossing: 0.40
    multi_crane_avoidance: 0.20
    delayed_or_failed_avoidance: 0.10

crane_static:
  tower_height_range_m: [35.0, 55.0]
  jib_length_range_m: [35.0, 50.0]
  min_radius_range_m: [4.0, 8.0]
  max_radius_margin_m: 3.0
  load_capacity_range_kg: [6000.0, 12000.0]
  safety_radius_arm_m: 3.0
  safety_radius_hook_m: 3.0

motion_limits:
  max_theta_dot_range_rad_s: [0.10, 0.22]
  max_r_dot_range_m_s: [0.8, 1.6]
  max_h_dot_range_m_s: [0.6, 1.2]
  max_theta_acc_range_rad_s2: [0.05, 0.12]
  max_r_acc_range_m_s2: [0.25, 0.55]
  max_h_acc_range_m_s2: [0.20, 0.45]
  response_tau_s_range: [1.0, 2.5]

load_effect:
  enabled: true
  min_acc_scale: 0.5

dynamics:
  emergency_brake_scale: 2.0

task_generation:
  tasks_per_crane_range: [1, 2]
  pickup_height_range_m: [3.0, 8.0]
  dropoff_height_range_m: [3.0, 10.0]
  transport_height_ratio: [0.55, 0.85]
  load_weight_ratio_range: [0.10, 0.80]
  stage_tolerance:
    theta_rad: 0.05
    r_m: 0.6
    h_m: 0.6

controller:
  k_theta: 0.35
  k_r: 0.25
  k_h: 0.35
  command_smoothing: true
  command_smoothing_alpha: 0.15

interaction:
  enabled: true
  short_horizon_check_s: 6.0
  avoidance_reaction_delay_s_range: [0.0, 1.0]
  communication_delay_s_range: [0.0, 0.5]
  avoidance_failure_probability: 0.08
  operator_error_probability: 0.03
  brake_when_predicted_risk: true
  priority_policy: static_priority

risk_thresholds:
  d_safe_arm_arm_m: 3.0
  d_safe_arm_hook_m: 3.0
  d_safe_hook_hook_m: 3.0

sensor_observation:
  enabled: true
  theta_noise_std_rad: 0.01
  r_noise_std_m: 0.08
  h_noise_std_m: 0.08
  theta_bias_std_rad: 0.005
  r_bias_std_m: 0.05
  h_bias_std_m: 0.05
  delay_steps_range: [0, 1]
  dropout_probability: 0.01
  outlier_probability: 0.01
  keep_missing_mask: true

windowing:
  input_window_s: 5.0
  prediction_horizon_s: 5.0
  prediction_horizons_s: [2.0, 5.0]
  stride_s: 2.5
  variable_num_cranes: true
  padding_to_max_cranes: true
  max_cranes: 4

split:
  method: by_scenario_id
  train_ratio: 0.50
  val_ratio: 0.25
  test_ratio: 0.25
  add_generalization_test: false

quality_control:
  target_risk_ratio_range: [0.02, 0.60]
  fail_on_risk_ratio_out_of_range: false
  generate_summary_plots: true
  fail_on_nan_in_required_fields: true
  fail_on_future_leakage: true
