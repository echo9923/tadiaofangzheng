[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tower-crane-stgraph-sim"
version = "0.1.0"
description = "Physical-prior spatio-temporal graph simulation dataset generator for multi tower cranes."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "tqdm>=4.66",
  "tabulate>=0.9",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
parquet = ["pyarrow>=14.0"]
visual = ["streamlit>=1.30", "plotly>=5.20", "imageio>=2.34", "imageio-ffmpeg>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
